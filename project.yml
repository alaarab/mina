name: Mina
options:
  bundleIdPrefix: com.alaarab
  deploymentTarget:
    iOS: "17.0"
  xcodeVersion: "16.0"
  createIntermediateGroups: true

configFiles:
  Debug: Signing.xcconfig
  Release: Signing.xcconfig

settings:
  base:
    MARKETING_VERSION: "0.2.0"
    CURRENT_PROJECT_VERSION: 1
    SWIFT_VERSION: "5.0"
    IPHONEOS_DEPLOYMENT_TARGET: "17.0"
    TARGETED_DEVICE_FAMILY: "1"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    SWIFT_STRICT_CONCURRENCY: minimal
    CODE_SIGN_STYLE: Automatic

targets:
  Mina:
    type: application
    platform: iOS
    sources:
      - path: Mina
        excludes:
          - "**/.DS_Store"
    info:
      path: Mina/Resources/Info.plist
      properties:
        CFBundleDisplayName: Mina
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        LSRequiresIPhoneOS: true
        CKSharingSupported: true
        INAlternativeAppNames:
          - INAlternativeAppName: Mina log
          - INAlternativeAppName: Mina app
          - INAlternativeAppName: The baby
        ITSAppUsesNonExemptEncryption: false
        UILaunchScreen:
          UIColorName: LaunchBackground
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        UIRequiresFullScreen: true
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UIBackgroundModes:
          - remote-notification
          - fetch
        BGTaskSchedulerPermittedIdentifiers:
          - com.alaarab.mina.nanit-sync
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alaarab.mina
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    dependencies:
      - target: MinaWidgets
    entitlements:
      path: Mina/Resources/Mina.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.alaarab.mina
        com.apple.developer.icloud-container-identifiers:
          - iCloud.com.alaarab.mina
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development

  MinaTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: MinaTests
    dependencies:
      - target: Mina
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES

  MinaUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: MinaUITests
    dependencies:
      - target: Mina
    settings:
      base:
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Mina

  MinaWidgets:
    type: app-extension
    platform: iOS
    sources:
      - path: MinaWidgets
      - path: Mina/Data/MinaModel.swift
      - path: Mina/Data/PersistenceController.swift
      - path: Mina/Data/Logbook.swift
      - path: Mina/Data/Summary.swift
      - path: Mina/App/Preferences.swift
      - path: Mina/Design/Theme.swift
    info:
      path: MinaWidgets/Info.plist
      properties:
        CFBundleDisplayName: Mina
        CFBundleShortVersionString: "$(MARKETING_VERSION)"
        CFBundleVersion: "$(CURRENT_PROJECT_VERSION)"
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.alaarab.mina.widgets
        INFOPLIST_KEY_CFBundleDisplayName: Mina
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
    entitlements:
      path: MinaWidgets/MinaWidgets.entitlements
      properties:
        com.apple.security.application-groups:
          - group.com.alaarab.mina

